<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Six Field Visual Preview</title>
    <style>
        * { box-sizing: border-box; }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
            font-family: "Segoe UI", sans-serif;
        }

        .record {
            display: grid;
            gap: 6px;
            width: min(100% - 32px, 300px);
            padding: 8px 9px 10px;
            border: 2px solid #168577;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 2px 0 #168577;
        }

        .summary {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: end;
            gap: 10px;
        }

        .title {
            color: #111;
            font-size: 13px;
            line-height: 16px;
        }

        .primary-value {
            margin-top: 7px;
            color: #111;
            font-size: 20px;
            font-weight: 700;
            line-height: 25px;
        }

        .change {
            align-self: end;
            margin-bottom: 1px;
            color: #00a651;
            font-size: 13px;
            font-weight: 400;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px 12px;
            padding-top: 2px;
        }

        .field {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: baseline;
            gap: 6px;
        }

        .label {
            color: #333;
            font-size: 9px;
            font-weight: 400;
            text-transform: uppercase;
        }

        .value {
            color: #111;
            font-size: 11px;
            font-weight: 400;
            text-align: right;
        }
    </style>
</head>
<body>
    <section class="record" aria-label="Six Field Visual preview">
        <div class="summary">
            <div>
            <div class="title">Geplaatst</div>
            <div class="primary-value">6.654</div>
            </div>
            <div class="change">+211</div>
        </div>
        <div class="details">
            <div class="field"><span class="label">BOL</span><span class="value">4.365</span></div>
            <div class="field"><span class="label">Verschil BOL</span><span class="value">+110</span></div>
            <div class="field"><span class="label">BBL</span><span class="value">2.289</span></div>
            <div class="field"><span class="label">Verschil BBL</span><span class="value">+101</span></div>
        </div>
    </section>
</body>
</html>
