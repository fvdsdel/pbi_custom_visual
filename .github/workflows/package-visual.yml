name: Package Power BI visual

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.0

      - name: Install dependencies
        run: npm install

      - name: Package visual
        run: npx pbiviz package

      - name: Upload packaged visual
        uses: actions/upload-artifact@v4
        with:
          name: SixFieldVisual
          path: dist/*.pbiviz
          if-no-files-found: error
